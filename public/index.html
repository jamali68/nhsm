<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 📱 Progressive Web App (PWA) Standards -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EasyBill">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Bill Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 5px solid rgba(255,255,255,0.2);
            border-top-color: #27ae60;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <!-- 🛡️ Security Shield & Domain Guard -->
    <script src="app-guard.js"></script>
    <script>
        // Direct redirect to auth.html
        window.location.replace('auth.html');
    </script>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <div>⚡ Easy Bill Generator — Loading...</div>
    </div>
</body>
</html>
