<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NH POS & Customer Ledger</title>
    <meta name="description" content="Multi-tenant POS and Billing system with Customer Khata Ledger, Stock Inventory, Invoice Templates, and Payment History tracking." />
    <meta property="og:title" content="NH POS & Customer Ledger" />
    <meta property="og:description" content="Multi-tenant POS and Billing system with Customer Khata Ledger, Stock Inventory, Invoice Templates, and Payment History tracking." />
    <meta property="og:type" content="website" />
    <!-- 📱 Progressive Web App (PWA) Tags -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0E0F09" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NH POS" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // 📱 Register Service Worker immediately in top-level head
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          var isSubpath = window.location.pathname.startsWith('/nhsm/');
          var swPath = isSubpath ? '/nhsm/sw.js' : 'sw.js';
          var swScope = isSubpath ? '/nhsm/' : './';
          navigator.serviceWorker.register(swPath, { scope: swScope }).catch(function() {});
        });
      }
    </script>
  </head>
  <body>
    <script>
      // 🚀 Smart Multi-Environment Auto-Router (GitHub Pages / Netlify / Dev Server)
      (function() {
        var isGitHubPages = window.location.hostname.endsWith('github.io');
        var path = window.location.pathname;
        var query = window.location.search || '';
        var hash = window.location.hash || '';

        // Check if user has active session in localStorage/sessionStorage
        var hasActiveSession = false;
        try {
          hasActiveSession = Boolean(localStorage.getItem('eb_user_role') || sessionStorage.getItem('eb_user_profile'));
        } catch (_) {}

        var targetFile = hasActiveSession ? 'dashboard.html' : 'auth.html';

        // 🌐 GitHub Pages Environment (e.g. https://jamali68.github.io/nhsm/)
        if (isGitHubPages) {
          var segments = path.split('/').filter(Boolean);
          var repoSlug = (segments.length > 0 && segments[0] !== 'public' && !segments[0].endsWith('.html')) 
            ? segments[0] 
            : '';
          var prefix = repoSlug ? ('/' + repoSlug) : '';
          
          // In raw GitHub repository deployment, files reside in public/ folder
          var destination = prefix + '/public/' + targetFile + query + hash;
          window.location.replace(destination);
          return;
        }

        // ⚡ Netlify / Local Dev Server (public folder mounted at root)
        window.location.replace('/' + targetFile + query + hash);
      })();
    </script>
    <div id="root">
      <div style="position:fixed; inset:0; width:100vw; height:100vh; background:#0E0F09; z-index:999999; overflow:hidden; user-select:none;">
        <style>
          @keyframes runDotsInit {
            0% { content: ''; }
            20% { content: ' .'; }
            40% { content: ' . .'; }
            60% { content: ' . . .'; }
            80% { content: ' . . . .'; }
            100% { content: ' . . . . .'; }
          }
          .init-running-dots::after {
            content: '';
            animation: runDotsInit 1.5s steps(5, end) infinite;
          }
        </style>
        <img src="nh-pos-splash.jpg" alt="NH POS Splash" style="position:absolute; inset:0; width:100%; height:100%; object-fit:contain; object-position:center; display:block; background:#0E0F09;" />
        <div style="position:absolute; left:0; right:0; top:78%; display:flex; justify-content:center; align-items:center; z-index:10; text-align:center; padding:0 16px;">
          <div style="font-family:'Segoe UI',Roboto,Helvetica,sans-serif; font-size:14px; font-weight:700; color:#4ade80; letter-spacing:0.4px; display:inline-flex; align-items:center; justify-content:center;">
            <span>System is Loading Please Wait<span class="init-running-dots"></span></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
