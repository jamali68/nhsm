<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NH POS & Customer Ledger</title>
    <meta name="description" content="Multi-tenant POS and Billing system with Customer Khata Ledger, Stock Inventory, Invoice Templates, and Payment History tracking." />
    <meta property="og:title" content="NH POS & Customer Ledger" />
    <meta property="og:description" content="Multi-tenant POS and Billing system with Customer Khata Ledger, Stock Inventory, Invoice Templates, and Payment History tracking." />
    <meta property="og:type" content="website" />
    <!-- 📱 Progressive Web App (PWA) Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NH POS" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  </head>
  <body>
    <script>
      // 🚀 Auto-route for GitHub Pages, Netlify or static web hosting:
      (function() {
        var isLocalDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '0.0.0.0';
        var isAISPreview = window.location.hostname.indexOf('run.app') !== -1;
        if (!isLocalDev && !isAISPreview) {
          if (window.location.hostname.indexOf('github.io') !== -1) {
            window.location.replace('public/auth.html');
          } else {
            window.location.replace('auth.html');
          }
        }
      })();
    </script>
    <div id="root">
      <div style="position:fixed; inset:0; background:#f7f6f0; z-index:999999; display:flex; align-items:center; justify-content:center; flex-direction:column; padding:16px; user-select:none;">
        <style>
          @keyframes runDotsInit {
            0% { content: ''; }
            20% { content: ' .'; }
            40% { content: ' . .'; }
            60% { content: ' . . .'; }
            80% { content: ' . . . .'; }
            100% { content: ' . . . . .'; }
          }
          .init-running-dots::after {
            content: '';
            animation: runDotsInit 1.5s steps(5, end) infinite;
          }
        </style>
        <div style="max-width:340px; width:100%; display:flex; flex-direction:column; align-items:center; text-align:center;">
          <img src="/nh-pos-splash.jpg" alt="NH POS Splash" style="max-height:70vh; max-width:100%; object-fit:contain; border-radius:18px; filter:drop-shadow(0 8px 24px rgba(0,0,0,0.06));" />
          <div style="font-family:'Segoe UI',Roboto,Helvetica,sans-serif; font-size:14px; font-weight:700; color:#14532d; margin-top:14px; letter-spacing:0.4px; display:inline-flex; align-items:center; justify-content:center;">
            <span>System is Loading Please Wait<span class="init-running-dots"></span></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
