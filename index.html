<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NH POS & Customer Ledger</title>
    <meta name="description" content="Multi-tenant POS and Billing system with Customer Khata Ledger, Stock Inventory, Invoice Templates, and Payment History tracking." />
    <meta property="og:title" content="NH POS & Customer Ledger" />
    <meta property="og:description" content="Multi-tenant POS and Billing system with Customer Khata Ledger, Stock Inventory, Invoice Templates, and Payment History tracking." />
    <meta property="og:type" content="website" />
    <!-- 📱 Progressive Web App (PWA) Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NH POS" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <script>
      // 📱 Register Service Worker immediately in top-level head
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function() {});
        });
      }
    </script>
  </head>
  <body>
    <script>
      // 🚀 Auto-route: On mobile devices, standalone mode, or production hosting, route directly to top-level app!
      (function() {
        var isMobile = /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        if (isMobile || isStandalone) {
          window.location.replace('/dashboard.html');
          return;
        }

        var isLocalDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '0.0.0.0';
        var isAISPreview = window.location.hostname.indexOf('run.app') !== -1;
        if (!isLocalDev && !isAISPreview) {
          window.location.replace('/dashboard.html');
        }
      })();
    </script>
    <div id="root">
      <div style="position:fixed; inset:0; width:100vw; height:100vh; background:#f7f6ed; z-index:999999; overflow:hidden; user-select:none;">
        <style>
          @keyframes runDotsInit {
            0% { content: ''; }
            20% { content: ' .'; }
            40% { content: ' . .'; }
            60% { content: ' . . .'; }
            80% { content: ' . . . .'; }
            100% { content: ' . . . . .'; }
          }
          .init-running-dots::after {
            content: '';
            animation: runDotsInit 1.5s steps(5, end) infinite;
          }
        </style>
        <img src="/nh-pos-splash.jpg" alt="NH POS Splash" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; display:block;" />
        <div style="position:absolute; left:0; right:0; top:74%; display:flex; justify-content:center; align-items:center; z-index:10; text-align:center; padding:0 16px;">
          <div style="font-family:'Segoe UI',Roboto,Helvetica,sans-serif; font-size:14px; font-weight:700; color:#14532d; letter-spacing:0.4px; display:inline-flex; align-items:center; justify-content:center;">
            <span>System is Loading Please Wait<span class="init-running-dots"></span></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
